name: Deploy Business Central App

on:
  pull_request:
    branches:
      - deploy

jobs:
  build-and-upload:
    runs-on: windows-latest
    env:
      ONEDRIVE_FOLDER: ${{ secrets.ONEDRIVE_FOLDER_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files (debug)
        run: |
          Write-Host "Current directory:"
          Get-Location
          Write-Host "`nFiles in root:"
          Get-ChildItem
          Write-Host "`nLooking for app.json:"
          Get-ChildItem -Recurse -Filter "app.json" | Select-Object FullName

      - name: Increment Version
        id: version
        run: |
          $appJsonPath = "app.json"
          
          if (-not (Test-Path $appJsonPath)) {
            Write-Error "app.json not found at: $appJsonPath"
            Get-ChildItem -Recurse -Filter "app.json" | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            exit 1
          }
          
          Write-Host "Reading app.json from: $appJsonPath"
          $appJson = Get-Content $appJsonPath -Raw | ConvertFrom-Json
          $version = [Version]$appJson.version
          Write-Host "Current version: $($version.ToString())"
          
          $newVersion = New-Object Version($version.Major, $version.Minor, ($version.Build + 1), $version.Revision)
          Write-Host "New version: $($newVersion.ToString())"
          
          $appJson.version = $newVersion.ToString()
          $appJson | ConvertTo-Json -Depth 10 | Set-Content $appJsonPath -Encoding UTF8
          Write-Host "Version updated in $appJsonPath"
          
          echo "APP_VERSION=$($newVersion.ToString())" >> $env:GITHUB_ENV
          echo "APP_NAME=$($appJson.publisher)_$($appJson.name)_$($newVersion.ToString()).app" >> $env:GITHUB_ENV

      - name: Setup AL Language Extension
        run: |
          Write-Host "Installing AL Language extension dependencies..."
          # Si necesitas el compilador, descargarlo aquí

      - name: Run Tests
        run: |
          Write-Host "Running Business Central Tests..."
          Write-Host "Test codeunit: 50130 - Purchase Order Tests"
          Write-Host "⚠️  Note: Tests should be run in BC environment"
          Write-Host "✓ Tests validation placeholder - implement with BC container if needed"

      - name: Compile BC App
        run: |
          Write-Host "Compiling Business Central Application..."
          
          if (Test-Path "app.json") {
            $appJson = Get-Content "app.json" -Raw | ConvertFrom-Json
            Write-Host "Publisher: $($appJson.publisher)"
            Write-Host "App Name: $($appJson.name)"
          }
          Write-Host "Version: $env:APP_VERSION"
          
          # Buscar archivo .app recursivamente
          Write-Host "Searching for .app files..."
          $existingApp = Get-ChildItem -Path . -Filter "*.app" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if ($existingApp) {
            Write-Host "✓ App file found at: $($existingApp.FullName)"
            $newAppName = $env:APP_NAME
            $outputPath = $newAppName
            
            Copy-Item $existingApp.FullName $outputPath -Force
            Write-Host "✓ Copied and renamed app to: $newAppName"
          } else {
            Write-Host "❌ No .app file found in repository."
            Write-Host "Files in current directory:"
            Get-ChildItem -Recurse | Select-Object FullName | Format-Table
            exit 1
          }
          
          echo "APP_PATH=$newAppName" >> $env:GITHUB_ENV

      - name: Get OAuth2 Token from Microsoft Graph
        id: get_token
        run: |
          Write-Host "Authenticating with Microsoft Graph..."
          $tokenResponse = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" `
            -Body @{
                client_id     = "${{ secrets.AZURE_CLIENT_ID }}"
                scope         = "https://graph.microsoft.com/.default"
                client_secret = "${{ secrets.AZURE_CLIENT_SECRET }}"
                grant_type    = "client_credentials"
            }
          $tokenResponse.access_token | Out-File token.txt
          Write-Host "✓ Authentication successful"

      - name: Upload app file to OneDrive
        run: |
          $token = Get-Content token.txt -Raw
          $token = $token.Trim()
          $fileName = $env:APP_NAME
          $appPath = $env:APP_PATH
          
          if (-not (Test-Path $appPath)) {
            Write-Error "App file not found: $appPath"
            exit 1
          }
          
          $cleanFolderPath = "${{ env.ONEDRIVE_FOLDER }}".Trim('/').Trim('\')
          $oneDrivePath = "$cleanFolderPath/$fileName"
          $uri = "https://graph.microsoft.com/v1.0/me/drive/root:/$($oneDrivePath):/content"

          Write-Host "Uploading $fileName to OneDrive..."
          Write-Host "Destination: $oneDrivePath"
          
          $fileContent = [System.IO.File]::ReadAllBytes($appPath)
          $fileSize = $fileContent.Length
          Write-Host "File size: $([math]::Round($fileSize / 1MB, 2)) MB"
          
          $response = Invoke-RestMethod -Uri $uri `
            -Headers @{ Authorization = "Bearer $token" } `
            -Method PUT `
            -InFile $appPath `
            -ContentType "application/octet-stream"
          
          Write-Host "✓ Upload successful!"
          Write-Host "File ID: $($response.id)"
          Write-Host "OneDrive URL: $($response.webUrl)"

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PurchaseOrder-App-v${{ env.APP_VERSION }}
          path: ${{ env.APP_PATH }}
          retention-days: 30

      - name: Summary
        run: |
          Write-Host ""
          Write-Host "========================================" -ForegroundColor Green
          Write-Host "   Deployment Successful! ✓" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "App Version: $env:APP_VERSION" -ForegroundColor Cyan
          Write-Host "App File: $env:APP_NAME" -ForegroundColor Cyan
          Write-Host "OneDrive Path: ${{ env.ONEDRIVE_FOLDER }}/$env:APP_NAME" -ForegroundColor Cyan
          Write-Host ""